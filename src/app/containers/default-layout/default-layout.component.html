
  <div bsModal #dangerModal1="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">

        <div class="modal-footer">

          <button type="button" class="btn btn-danger" (click)="seDecoonecter()">Se déconnecter</button>
        </div>
      </div><!-- /.modal-content -->
    </div><!-- /.modal-dialog -->
