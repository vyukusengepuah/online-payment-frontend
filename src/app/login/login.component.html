<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4>Connexion</h4>
        </div>
        <div class="card-body">
          <div *ngIf="erreur" class="alert alert-danger">
            {{ erreur }}
          </div>
          <div class="mb-3">
            <label class="form-label">Nom d'utilisateur</label>
            <input type="text" class="form-control" [(ngModel)]="username" placeholder="admin">
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" class="form-control" [(ngModel)]="password" placeholder="admin123">
          </div>
          <button class="btn btn-primary w-100" (click)="seConnecter()">Se connecter</button>
        </div>
      </div>
    </div>
  </div>
</div>
