  <div   id="layoutAuthentication" style="background: #DADADA;height: 100vh; ">
    <div id="layoutAuthentication_content" >
        <main>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-6">
                        <div class="card shadow-lg border-0 rounded-lg mt-5">
  
                          <div    class='bg-success text-white' style="padding: 10px;"> 
                              Verification OTP
                          </div>
                          <div    class='alert alert-success'> 
                            Le code OTP vous été envoyé sur mail
                          </div>
  
                            <div  *ngIf="!noConnected"  class='alert alert-danger'> 
                                {{message}}
                            </div>
                            
                            
                            <div class="card-header"><h3 class="text-center font-weight-light my-4"><a [href]=""><img src="../../../assets/img/bancobu_logo.png" width="100"></a></h3></div>

                            <div class="card-body">
                                <form [formGroup]="user_form" class=""   (ngSubmit)="handleClick()">
                                    <div class="form-group ">
                                    <!-- <div class="card px-5 py-5"> -->
                                      <div class="form-input text-center font-weight-light my-4">
                                        <!-- <input type="text" name="phoneNumber" placeholder="Phone Number" class="form-control  py-4"
                                          placeholder="Enter Phone Number"  formControlName="phoneNumber" min="10" max="15"> -->
                                          <ng-otp-input #ngOtpInput  (onInputChange)="onOtpChange($event)" [config]="configuration"></ng-otp-input>
                                          <span style="color: red;" class="error" *ngIf="user_form.controls['otp'].invalid && (user_form.controls['otp'].dirty || user_form.controls['otp'].touched)" >
                                            code is required
                                        </span>
                                      </div>
                                      <div class="form-group  mt-4 mb-0" style="width: 100%;">
                                        <!-- <a style="float: left;" (click)="seDecoonecter()"  href=""  style="color:red">Retour</a> -->
                                        <div id="sign-in-button"></div>
                                        <button style="float: left;" (click)="renvoyer()" class="btn btn-success">Renvoyer un nouveau code</button>
                                        <button style="float: right;" type="submit" (click)="noConnected=true" class="btn btn-success">Verifier OTP</button>
                                        
                                    </div>
                                    <!-- </div> -->
                                </div>
                                </form>
                                
                            </div>
  
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
  
  </div>

  <div class="container-fluid py-4  mt-auto" style="position: fixed;bottom: 1px;color: #18b625;font-size: 22px;">
    <div class="d-flex align-items-center justify-content-between small">
