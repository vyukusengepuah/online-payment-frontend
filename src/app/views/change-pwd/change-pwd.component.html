
<div  *ngIf="is_threre_users" id="layoutAuthentication" style="background: #DADADA;height: 100vh; ">
    <div id="layoutAuthentication_content" >
        <main>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-6">
                        <div class="card shadow-lg border-0 rounded-lg mt-5">
  
                          <div  *ngIf="probleme"  class='alert alert-danger'> 
                              ECHEC ! PROBLEME DE CONNEXION SUR LE SERVEUR
                          </div>
  
                            <div  *ngIf="!noConnected"  class='alert alert-danger'> 
                                {{message}}
                            </div>
                            
                            <div class="card-header">
                                <center><img  class="images" src="../../../assets/img/bancobu_logo.png" width="100"></center>
                                <!-- <h3 class="text-center font-weight-light my-4">Authentification</h3> -->
                            </div>
                            <div class="card-body">
                                <form [formGroup]="auth_form" (ngSubmit)="submit()">
                                    <!-- <div class="form-group">
                                        <label class="small mb-1" for="inputEmailAddress"></label>
                                        <input class="form-control py-4"  formControlName="username" type="text" placeholder="Email ou Nom d'utilisateur" autocomplete="disabled" />
                                        <span style="color: red;" class="error" *ngIf="auth_form.controls['username'].invalid && (auth_form.controls['username'].dirty || auth_form.controls['username'].touched)" >
                                            Username is required
                                        </span>
                                    </div> -->
                                    <div class="form-group ">
                                        <div class="input-group">
                                            
                                            <input class="form-control py-4" id="pwd" 
                                            [type]="showPasswordOnPress ? 'text' : 'password'" formControlName="pwd" placeholder="Ancien Mot de passe"  autocomplete="disabled" appPassword/>
                                            
                                            <div class="input-group-append" (mousedown)="showPasswordOnPress = !showPasswordOnPress;" (click)="focus()"
                                                (mouseup)="showPasswordOnPress = !showPasswordOnPress">
                                                    <span class="input-group-text" >
                                                        <i alt="show" class="fa fa-eye eye-show"
                                                        *ngIf="!showPasswordOnPress"></i>
                                                        <i alt="hide" style="color: red;" class="fa fa-eye-slash"
                                                        *ngIf="showPasswordOnPress"></i>
                                                    </span>
                                                </div>
                                        </div>  
                                        <span style="color: red;" class="error" *ngIf="auth_form.controls['pwd'].invalid && (auth_form.controls['pwd'].dirty || auth_form.controls['pwd'].touched)" >
                                            Le mot de passe est requis
                                        </span>
                                    </div>  
                                    <div class="form-group ">
                                        <div class="input-group">
                                            
                                            <input class="form-control py-4" id="pwd1" 
                                            [type]="showPasswordOnPress ? 'text' : 'password'" formControlName="pwd1" placeholder="Nouveau Mot de passe"  autocomplete="disabled" appPassword/>
                                            
                                            <div class="input-group-append" (mousedown)="showPasswordOnPress = !showPasswordOnPress;" (click)="focus()"
                                                (mouseup)="showPasswordOnPress = !showPasswordOnPress">
                                                    <span class="input-group-text" >
                                                        <i alt="show" class="fa fa-eye eye-show"
                                                        *ngIf="!showPasswordOnPress"></i>
                                                        <i alt="hide" style="color: red;" class="fa fa-eye-slash"
                                                        *ngIf="showPasswordOnPress"></i>
                                                    </span>
                                                </div>
                                        </div>  
                                        <span style="color: red;" class="error" *ngIf="auth_form.controls['pwd1'].invalid && (auth_form.controls['pwd1'].dirty || auth_form.controls['pwd1'].touched)" >
                                            Le mot de passe est requis et doit suivre la politique de complexité(Majuscule,Miniscule,caractère specal,numérique) ex: Motdepasse12*
                                        </span>
                                        <!-- <span style="color: red;" class="error" *ngIf="auth_form.controls['pwd1'].invalid && (auth_form.controls['pwd1'].dirty || auth_form.controls['pwd1'].touched)" >
                                            Password is required
                                        </span> -->
                                    </div>  
                                    <div class="form-group ">
                                        <div class="input-group">
                                            
                                            <input class="form-control py-4" id="pwd2" 
                                            [type]="showPasswordOnPress ? 'text' : 'password'" formControlName="pwd2" placeholder="Confirmer Mot de passe"  autocomplete="disabled" appPassword/>
                                            
                                            <div class="input-group-append" (mousedown)="showPasswordOnPress = !showPasswordOnPress;" (click)="focus()"
                                                (mouseup)="showPasswordOnPress = !showPasswordOnPress">
                                                    <span class="input-group-text" >
                                                        <i alt="show" class="fa fa-eye eye-show"
                                                        *ngIf="!showPasswordOnPress"></i>
                                                        <i alt="hide" style="color: red;" class="fa fa-eye-slash"
                                                        *ngIf="showPasswordOnPress"></i>
                                                    </span>
                                                </div>
                                        </div>  
                                        <span style="color: red;" class="error" *ngIf="auth_form.controls['pwd2'].invalid && (auth_form.controls['pwd2'].dirty || auth_form.controls['pwd2'].touched)" >
                                            Le mot de passe est requis
                                        </span>
                                    </div>  
  
  
  
                                    <div class="form-group ">
                                        <a href="" [routerLink]="['/login']" style="color:red">Retour</a>
                                        
                                        
                                        <button style="float: right;" type="submit" (click)="noConnected=true " [disabled]="auth_form.invalid" class="btn btn-success">changer</button>
                                    </div>
                                    <div>
                                        

                                    </div>
                                </form>
                            </div>
  
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
  
  </div>
 
  <div class="container-fluid py-4  mt-auto" style="position: fixed;bottom: 1px;color: #18b625;font-size: 22px;">
    <div class="d-flex align-items-center justify-content-between small">

       &copy; BANCOBU
    </div>
    </div>
