<div bsModal  #largeModal="bs-modal"[config]="{backdrop: 'static',  keyboard: false}" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-success" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">{{message}}</h4>
          <button style="color: red;" type="button" class="close" (click)="largeModal.hide()" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          
  
          <div style="width: 100%; min-height: 100px">
            <table style="font-size: 10px;">
                <tr class="table  table-bordered" *ngFor="let s of tableau_facture"><td style="font-weight: bold;" class="pt-2 pb-2"> {{s.KEY}}</td><td class="pt-2 pb-2">{{s.VALUE}}</td></tr>
            </table>
          </div>
          
  
        </div>
        <div class="modal-footer">
            <form [formGroup]="user_form1" (ngSubmit)="enregistrer_facture()" method="POST" enctype="multipart/form-data">
                <mat-form-field appearance="fill"  style="width: 100%;">
                    <mat-label>COMPTE DE PAIEMENT : <span style="color: red;">*</span></mat-label>
                    <mat-select formControlName="compte_paiement"
                     >
                    
                            
                        <mat-option *ngFor="let c of comptes_paiement" [value]="c.COMPTE_ID">
                            {{c.COMPTE}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <button type="submit" class="btn btn-success">Oui créer</button>
                <button type="button" class="btn btn-danger" (click)="largeModal.hide()">Non</button>
                <button type="button" class="btn btn-secondary" (click)="largeModal.hide()">Close</button>
                <!-- <button type="button" class="btn btn-success">Ajouter</button> -->
            </form>
        </div>
      </div><!-- /.modal-content -->
    </div><!-- /.modal-dialog -->
</div>

<form [formGroup]="user_form" (ngSubmit)="research()" method="POST" enctype="multipart/form-data">
<div class="animated fadeIn">
    <div class="card card-default">
      
        <div class="card-body">
            
                <div class="row" style="margin-bottom: -40px;">

                    <div class="col-md-6 form-group">
                        <mat-form-field appearance="fill"  style="width: 100%;">
                            <mat-label>Selectionnez le code d'installation : <span style="color: red;">*</span></mat-label>
                            <mat-select formControlName="compte">    
                                <mat-option *ngFor="let c of compteur" [value]="c.CODE">
                                    {{c.CODE}} ({{c.PROPRIETAIRE}})
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                                        
                        <!-- <mat-form-field class="example-full-width" appearance="fill" style="width: 100%;">
                            <mat-label>CODE D'INSTALLATION: <span style="color: red;">*</span></mat-label>
                            <input matInput formControlName="compte" id="compte" autocomplete="off"> 
                            
                        </mat-form-field> -->
    
                        
                    </div>
                    
                    <div class="col-md-2 form-group" style="padding: 10px;">
                        
                        <input type="submit" id="submit"  class="btn btn-success active form-control" value="Recherche">    
                    </div>
    
                    
                
                </div>
            
            <div class="row">
                
                                
                             
            </div>
          </div>
    </div>
    <div class="card card-default" *ngIf="facture_trouve">
      
        <div class="card-body">
            
                <div class="row" style="margin-bottom: -40px;">
                    <div class="col-md-12 form-group">
                        <label>Les factures de <b><span style="color: green;">{{owner}}</span></b></label>
                    </div>
                    <div class="col-md-6 form-group">
                        
                        <mat-form-field appearance="fill"  style="width: 100%;">
                            <mat-label>SELECTIONNEZ LA FACTURE : <span style="color: red;">*</span></mat-label>
                            <mat-select formControlName="facture"
                             >
                            
                                    
                                <mat-option *ngFor="let p of factures" [value]="p.Facture_Reference">
                                    {{p.Mois}}_{{p.Annee}}_{{p.Montant}} [{{p.NomClient}}]
                                </mat-option>
                            </mat-select>
                        </mat-form-field> 
    
                        
                    </div>
                    
                    <div class="col-md-2 form-group" style="padding: 10px;">
                        
                        <input type="button" id="submit"  class="btn btn-success active form-control" (click)="Consulter()" value="Consulter">    
                    </div>
    
                    
                
                </div>
            
            <div class="row">
                
                                
                             
            </div>
          </div>
    </div>
    <div class="card card-default" *ngIf="is_confirmation">
      
        <div class="card-body row">
            
            <div style="width: 60%; min-height: 100px;margin-bottom: 20px;">
                <table style="font-size: 10px;">
                    <tr class="table  table-bordered" *ngFor="let s of tableau_facture"><td style="font-weight: bold;" class="pt-2 pb-2"> {{s.KEY}}</td><td class="pt-2 pb-2">{{s.VALUE}}</td></tr>
                </table>
            </div>
            <div class="col-md-6">
                <form [formGroup]="user_form1" (ngSubmit)="enregistrer_facture()" method="POST" enctype="multipart/form-data">
                    <!-- <div class="col-md-12"> -->
                        <mat-form-field appearance="fill"  style="width: 100%;">
                            <mat-label>Selectionnez le compte de paiement : <span style="color: red;">*</span></mat-label>
                            <mat-select formControlName="compte_paiement"
                            >
                            
                                    
                                <mat-option *ngFor="let c of comptes_paiement" [value]="c.COMPTE_ID">
                                    {{c.COMPTE}}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    <!-- </div> -->

                    <button type="submit" class="btn btn-success"> Initier le paiement</button>
                    <!-- <button type="button" class="btn btn-danger" (click)="largeModal.hide()">Non</button>
                    <button type="button" class="btn btn-secondary" (click)="largeModal.hide()">Close</button> -->
                    <!-- <button type="button" class="btn btn-success">Ajouter</button> -->
                </form>
            </div>
        </div>
    </div>
</div>
</form>
