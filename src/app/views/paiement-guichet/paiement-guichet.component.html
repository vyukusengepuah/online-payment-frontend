
<form [formGroup]="user_form" (ngSubmit)="research()" method="POST" enctype="multipart/form-data">
    <div class="animated fadeIn">
        <div class="card card-default">
          
            <div class="card-body">
                
                    <div class="row" style="margin-bottom: -40px;">

                        <div class="col-md-3 form-group">
                            
                            <mat-form-field appearance="fill"  style="width: 100%;">
                                <mat-label>Type de Service : <span style="color: red;">*</span></mat-label>
                                <mat-select formControlName="type" (selectionChange)="select_type($event)" 
                                 >
                                    <mat-option [value]="'1'">
                                        Paiement facture
                                    </mat-option>
                                    <mat-option [value]="'2'">
                                        Cashpower
                                    </mat-option>
                                </mat-select>
                            </mat-form-field> 
        
                            
                        </div>
    
                        <div class="col-md-4 form-group">
                                            
                            <mat-form-field class="example-full-width" appearance="fill" style="width: 100%;">
                                <mat-label>Numero du compteur ou code d'installation: <span style="color: red;">*</span></mat-label>
                                <input matInput formControlName="compteur" id="compte" autocomplete="off"> 
                                
                            </mat-form-field>
        
                            
                        </div>
                        <div class="col-md-3 form-group" *ngIf="is_cashpower">
                                        
                            <mat-form-field class="example-full-width" appearance="fill" style="width: 100%;">
                                <mat-label>Montant: <span style="color: red;">*</span></mat-label>
                                <input matInput formControlName="Montant" id="Montant" autocomplete="off"> 
                                
                            </mat-form-field>
                        </div>
                       
                        <div class="col-md-2 form-group" style="padding: 10px;">
                            
                            <input type="submit" id="submit"  class="btn btn-success active form-control" value="Recherche">    
                        </div>
        
                        
                    
                    </div>
                
                <div class="row">
                    
                                    
                                 
                </div>
              </div>
        </div>
        
    </div>
</form>

<form [formGroup]="user_forms" (ngSubmit)="verifiction_compte()" method="POST" enctype="multipart/form-data">
    <div class="animated fadeIn">
        
        <div class="card card-default" *ngIf="facture_trouve">
          
            <div class="card-body">
                
                    <div class="row" style="margin-bottom: -40px;">
                        <div class="col-md-12 form-group">
                            <label>Les factures de <b><span style="color: green;">{{owner}}</span></b></label>
                        </div>
                        <div class="col-md-6 form-group">
                            
                            <mat-form-field appearance="fill"  style="width: 100%;">
                                <mat-label>SELECTIONNEZ LA FACTURE : <span style="color: red;">*</span></mat-label>
                                <mat-select formControlName="facture"
                                 >
                                
                                        
                                    <mat-option *ngFor="let p of factures" [value]="p.Facture_Reference">
                                        {{p.Mois}}_{{p.Annee}}_{{p.Montant}} [{{p.NomClient}}]
                                    </mat-option>
                                </mat-select>
                            </mat-form-field> 
        
                            
                        </div>
                        
                        <!-- <div class="col-md-2 form-group" style="padding: 10px;">
                            
                            <input type="button" id="submit"  class="btn btn-success active form-control" (click)="Consulter()" value="Consulter">    
                        </div> -->
        
                        
                    
                    </div>
                
                <div class="row">
                    
                                    
                                 
                </div>
              </div>
        </div>
        <div class="card card-default" *ngIf="is_confirmation">
          
            <div class="card-body row">
                
                <div style="width: 60%; min-height: 100px;margin-bottom: 20px;">
                    <table style="font-size: 10px;">
                        <tr class="table  table-bordered" *ngFor="let s of tableau_facture"><td style="font-weight: bold;" class="pt-2 pb-2"> {{s.KEY}}</td><td class="pt-2 pb-2">{{s.VALUE}}</td></tr>
                    </table>
                </div>
                <div class="col-md-6 form-group">
                                        
                    <mat-form-field appearance="fill"  style="width: 100%;">
                        <mat-label>BRANCHE: <span style="color: red;">*</span></mat-label>
                        <mat-select formControlName="branche" (click)="refresh_branche()"
                         >
                        
                            <mat-option>
                                <ngx-mat-select-search formControlName="filter_branche"
                                placeholderLabel="Research..." 
                                (keyup)="onKey_branche($event.target.value)" (click)="refresh_branche()"></ngx-mat-select-search>
                            
                            </mat-option>
                                
                            <mat-option *ngFor="let p of branche_filtre" [value]="p.AGE">
                                {{p.AGE}}-{{p.LIB}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field> 

                    
                </div>
                <div class="col-md-6">
                    <!-- <form [formGroup]="user_forms1" (ngSubmit)="enregistrer_facture()" method="POST" enctype="multipart/form-data"> -->
                        <!-- <div class="col-md-12"> -->
                            <mat-form-field appearance="fill"  style="width: 100%;">
                                <mat-label>Saisissez le compte de paiement : <span style="color: red;">*</span></mat-label>
                                <!-- <mat-select formControlName="compte_paiement"> 
                                    <mat-option *ngFor="let c of comptes_paiement" [value]="c.COMPTE_ID">
                                        {{c.COMPTE}}
                                    </mat-option>
                                </mat-select> -->
                                <input matInput formControlName="compte_paiement" id="compcompte_paiementte" autocomplete="off"> 

                            </mat-form-field>
                        <!-- </div> -->
    
                         <!-- </form> -->
                </div>
                <button type="submit" class="btn btn-success"> Verification de compte</button>

            </div>
        </div>
    </div>

    <div class="animated fadeIn" *ngIf="societ_is_found">
        <div class="card card-default">
          
          <div class="card-body">
            
            <div class="row">
                <div style="padding: 10px;" class="col-md-8" >
                    <table style="font-size: 10px;">
                        <tr class="table  table-bordered" *ngFor="let s of tableau_societe"><td style="font-weight: bold;" class="pt-2 pb-2"> {{s.KEY}}</td><td class="pt-2 pb-2">{{s.VALUE}}</td></tr>
                    </table>

                    <button *ngIf="COMPTE_ID" style="margin-top: 30px;" (click)="initier_paiement()" type="button" class="btn btn-success"> initier le paiement</button>

                </div>

            </div>
            
          </div>
        </div>
    </div>
</form>
