<div class="container mt-5">
  
  <!-- ========================================== -->
  <!-- EN-TÊTE : Titre + Bouton de déconnexion -->
  <!-- ========================================== -->
  <div class="d-flex justify-content-between align-items-center mb-5">
    <h2 class="page-title m-0">Portail UAT - Menu Principal</h2>
    <button class="btn btn-danger" (click)="seDeconnecter()">
      Déconnexion
    </button>
  </div>

  <!-- ========================================== -->
  <!-- MENU : Les 4 cartes -->
  <!-- ========================================== -->
  <div class="row justify-content-center">
    
    <!-- Carte 1 : Environnement -->
    <div class="col-md-3 mb-4">
      <div class="card custom-card text-center h-100">
        <div class="card-body d-flex flex-column justify-content-center">
          <h4 class="card-title">Environnement</h4>
          <p class="card-text">Gérer les environnements UAT (créer, modifier).</p>
          <button class="btn btn-primary custom-btn mt-auto" (click)="goToEnvironment()">Accéder</button>
        </div>
      </div>
    </div>

    <!-- Carte 2 : Obtenir Token -->
    <div class="col-md-3 mb-4">
      <div class="card custom-card text-center h-100">
        <div class="card-body d-flex flex-column justify-content-center">
          <h4 class="card-title">Obtenir Token</h4>
          <p class="card-text">Demander un token à Bancobu (valable 60s).</p>
          <button class="btn btn-primary custom-btn mt-auto" (click)="goToToken()">Accéder</button>
        </div>
      </div>
    </div>

    <!-- Carte 3 : Initier Paiement -->
    <div class="col-md-3 mb-4">
      <div class="card custom-card text-center h-100">
        <div class="card-body d-flex flex-column justify-content-center">
          <h4 class="card-title">Initier Paiement</h4>
          <p class="card-text">Initier un paiement avec le token obtenu.</p>
          <button class="btn btn-primary custom-btn mt-auto" (click)="goToPaiement()">Accéder</button>
        </div>
      </div>
    </div>

    <!-- Carte 4 : Base de données -->
    <div class="col-md-3 mb-4">
      <div class="card custom-card text-center h-100">
        <div class="card-body d-flex flex-column justify-content-center">
          <h4 class="card-title">Base de données</h4>
          <p class="card-text">Consulter les données de la table environments.</p>
          <button class="btn btn-primary custom-btn mt-auto" (click)="goToDatabase()">Accéder</button>
        </div>
      </div>
    </div>

  </div>
</div>
